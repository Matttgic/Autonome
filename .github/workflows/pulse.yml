name: pulse
# Relais : les tâches programmées GitHub (cron) ne se déclenchent pas sur ce dépôt. Idée reprise de cotes-value
# (chaîne auto-relancée, 5 min) et Grotonome (boucle de 5 h, relevé toutes les 6 min) : ce job contrôle toutes les
# 5 min l'âge du dernier passage `live` (relancé dès LIVE_EVERY_MIN, défaut 15) et `coteur` (COTEUR_EVERY_MIN, défaut
# 60 : une cote coteur de plus de 45 min n'est jamais proposée), puis se relance lui-même au bout de ~5 h. Toujours sur la branche par défaut (jamais une branche figée).
# Dépôt public : minutes Actions gratuites. Arrêt : variable de dépôt PULSE = off.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 */3 * * *"
permissions:
  actions: write
  contents: read
concurrency: {group: autonome-pulse, cancel-in-progress: false}
jobs:
  pulse:
    if: vars.PULSE != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REF: ${{ github.event.repository.default_branch }}
      LIVE_EVERY: ${{ vars.LIVE_EVERY_MIN || '15' }}
      COTEUR_EVERY: ${{ vars.COTEUR_EVERY_MIN || '60' }}
    steps:
      - name: Relayer (5 h, contrôle toutes les 5 min)
        run: |
          age_min() {  # minutes depuis le dernier lancement du workflow $1 (99999 si inconnu)
            t=$(gh run list --workflow "$1" -L 1 --json createdAt -q '.[0].createdAt' 2>/dev/null)
            [ -z "$t" ] && { echo 99999; return; }
            echo $(( ( $(date -u +%s) - $(date -u -d "$t" +%s) ) / 60 ))
          }
          END=$((SECONDS + 300 * 60))
          while [ "$SECONDS" -lt "$END" ]; do
            a=$(age_min live.yml); c=$(age_min coteur.yml)
            echo "$(date -u +%FT%TZ) live il y a ${a} min, coteur il y a ${c} min"
            if [ "$c" -ge "$COTEUR_EVERY" ]; then gh workflow run coteur.yml --ref "$REF" && echo "-> coteur relancé"; fi
            if [ "$a" -ge "$LIVE_EVERY" ]; then gh workflow run live.yml --ref "$REF" && echo "-> live relancé"; fi
            sleep 300
          done
      - name: Se relancer
        if: always()
        run: gh workflow run pulse.yml --ref "$REF" || echo "relance refusee, le cron ou live reprendra"
