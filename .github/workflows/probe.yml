name: probe
# Mesure ce qui est lisible depuis les IP de GitHub (rien à installer côté utilisateur).
# Lancement manuel : Actions > probe > Run workflow. 1 requête / 4 s, User-Agent honnête,
# aucun contournement : un 403/captcha est noté « bloqué » et on passe.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Sonde
        run: |
          python tools/probe.py tools/probe_urls.txt > probe.json
          python tools/probe_summary.py < probe.json | tee -a "$GITHUB_STEP_SUMMARY"
