<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Autonome</title>
<style>
:root{--bg:#f6f4ee;--paper:#fffdf8;--ink:#1c1b18;--soft:#5d5a52;--mute:#8f8b80;--rule:#e2ddd0;--rule2:#cfc8b6;
  --up:#1d6b45;--down:#a8432f;--flag:#8a6d1c;--sel:#1c1b18}
@media (prefers-color-scheme:dark){:root{--bg:#121210;--paper:#1a1a17;--ink:#ecebe5;--soft:#b5b2a8;--mute:#7f7c73;
  --rule:#2a2925;--rule2:#3a3833;--up:#6cc596;--down:#e48a72;--flag:#d9b85a;--sel:#ecebe5}}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;
  max-width:640px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:baseline;padding:18px 0 10px}
.brand{font:700 19px/1 Georgia,"Times New Roman",serif;letter-spacing:-.2px}
#maj{font-size:13px;color:var(--mute)}#maj.late{color:var(--down)}
nav{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;gap:22px;border-bottom:1px solid var(--rule2);margin-bottom:14px}
nav button{background:none;border:0;color:var(--mute);font:600 15px/1 inherit;padding:12px 0 11px;min-height:44px;cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px}
nav button.on{color:var(--ink);border-color:var(--sel)}
section{display:none}section.on{display:block}
h2{font:700 17px/1.25 Georgia,"Times New Roman",serif;margin:22px 0 4px}
h2:first-child{margin-top:4px}
.lead{color:var(--soft);font-size:14px;margin-bottom:12px}
.up{color:var(--up)}.down{color:var(--down)}.mute{color:var(--mute)}.flag{color:var(--flag)}
.bet{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:12px 14px 10px;margin-bottom:10px}
.bet.off{opacity:.62}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--mute);text-transform:none}
.match{font:700 16px/1.3 Georgia,"Times New Roman",serif;margin:3px 0 1px;overflow-wrap:anywhere}
.pick{font-size:14px;color:var(--soft);margin-bottom:9px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--rule)}
.grid div{padding:7px 0 6px;border-bottom:1px solid var(--rule)}
.grid dt{font-size:11.5px;color:var(--mute);letter-spacing:.2px}
.grid dd{font-size:15px;font-weight:600;white-space:nowrap}
.note{font-size:13px;margin-top:8px}
.why{font-size:14.5px;line-height:1.5;margin:-2px 0 10px}
details{margin-top:6px}
summary{font-size:13px;color:var(--soft);cursor:pointer;padding:4px 0;list-style:none;text-decoration:underline;text-decoration-color:var(--rule2);text-underline-offset:3px}
summary::-webkit-details-marker{display:none}
.calc{font-size:13px;color:var(--soft);padding:4px 0 2px;line-height:1.6}
.calc b{color:var(--ink);font-weight:600}
dl.sum{border-top:1px solid var(--rule2)}
dl.sum div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule)}
dl.sum dt{color:var(--soft)}dl.sum dd{font-weight:600;text-align:right}
.verdict{margin:12px 0 4px;padding:10px 12px;border-left:3px solid var(--flag);background:var(--paper);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;font-weight:500;color:var(--mute);text-align:right;padding:6px 0;border-bottom:1px solid var(--rule2)}
td{text-align:right;padding:8px 0;border-bottom:1px solid var(--rule)}
th:first-child,td:first-child{text-align:left}
td small{display:block;color:var(--mute);font-size:12px;font-weight:400}
ol{padding-left:18px;color:var(--soft);font-size:14px}ol li{margin:5px 0}
.foot{color:var(--mute);font-size:12.5px;margin-top:22px}
a{color:inherit}
</style>
</head>
<body>
<header><div class="brand">Autonome</div><div id="maj">chargement…</div></header>
<nav>
  <button data-t="paris" class="on">Paris</button>
  <button data-t="bilan">Bilan</button>
  <button data-t="marche">Marché</button>
  <button data-t="sante">Santé</button>
</nav>
<main>
  <section id="t-paris" class="on"></section>
  <section id="t-bilan"></section>
  <section id="t-marche"></section>
  <section id="t-sante"></section>
</main>
<script>
const SRC = "https://raw.githubusercontent.com/Matttgic/Autonome/data/site.json";
const BOOKS = {pmu_fr:"PMU",betclic_fr:"Betclic",winamax_fr:"Winamax",unibet_fr:"Unibet",netbet_fr:"NetBet",betsson_fr:"Betsson",
  olybet_fr:"Olybet",vbet_fr:"Vbet",daznbet_fr:"DAZN Bet",genybet_fr:"Genybet",feelingbet_fr:"Feelingbet",parionssport_fr:"Parions Sport",
  zebet_fr:"ZEbet",pokerstars_fr:"PokerStars",barrierebet_fr:"Barrière"};
const SUS = {ev_trop_grande:"Écarté : écart de plus de 30 %, presque toujours une erreur de référence.",
  marche_fige_50_50:"Écarté : marché Polymarket figé à 50/50 (forfait ou annulation probable), pas une vraie value."};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const bk = b => esc(BOOKS[b] || b || "—");
const fr = (x, d=2) => x == null ? "—" : Number(x).toFixed(d).replace(".", ",").replace("-", "−");
const pct = (x, d=1, sign=true) => x == null ? "—" : (sign && x > 0 ? "+" : "") + fr(x*100, d) + " %";
const eur = (x, sign=true) => x == null ? "—" : (sign && x > 0 ? "+" : "") + fr(x) + " €";
const tone = x => x == null || x === 0 ? "" : x > 0 ? "up" : "down";
const quand = iso => { if (!iso) return ""; const d = new Date(iso);
  return d.toLocaleString("fr-FR",{timeZone:"Europe/Paris",weekday:"short",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); };
const ago = iso => { const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 1 ? "à l'instant" : m < 60 ? `il y a ${m} min` : m < 1440 ? `il y a ${Math.floor(m/60)} h ${String(m%60).padStart(2,"0")}` : `il y a ${Math.round(m/1440)} j`; };
const sport = s => esc(String(s || "").split(" / ").slice(-1)[0]);
const RES = {"gagné":"up","perdu":"down"};

function cell(label, value, cls="") { return `<div><dt>${label}</dt><dd class="${cls}">${value}</dd></div>`; }
function calcul(h){
  const src = h.ref === "consensus-anj" ? "moyenne des bookmakers ANJ sans leur marge" : "prix Polymarket (milieu achat/vente)";
  const pk = h.p_prudente != null ? "p prudente" : "p";
  let c = `p = ${pct(h.p,1,false)}, ${src} ; cote juste = 1 / p = <b>${fr(h.juste)}</b><br>
    EV = p × cote − 1 = ${fr(h.p,4)} × ${fr(h.cote)} − 1 = <b>${pct(h.ev)}</b><br>`;
  if (h.p_prudente != null) c += `EV prudente (pire prix) = ${fr(h.p_prudente,4)} × ${fr(h.cote)} − 1 = ${pct(h.ev_prudente)}<br>`;
  if (h.kelly != null) c += `Kelly = (${pk} × cote − 1) / (cote − 1) = ${pct(h.kelly,1,false)} ; mise = ¼ Kelly, au plus 2 % de ${fr(h.bankroll,0)} €, arrondie à 0,50 € (minimum 1 €) = <b>${eur(h.mise,false)}</b><br>`;
  if (h.clv != null) c += `Clôture ${h.cloture_min} min avant : p = ${pct(h.p_cloture,1,false)} ; CLV = cote × p clôture − 1 = <b>${pct(h.clv)}</b>`;
  else c += h.etat === "en cours" ? "Clôture : pas encore mesurée." : "Clôture : non mesurée dans les 90 min avant le début.";
  if (h.gain != null && h.etat === "gagné") c += `<br>Gain = ${fr(h.mise)} × (${fr(h.cote)} − 1) = <b>${eur(h.gain)}</b>`;
  return c;
}
function bet(h){
  const res = h.etat === "gagné" || h.etat === "perdu" ? `<span class="${RES[h.etat]}">${eur(h.gain)}</span>` : esc(h.etat);
  return `<article class="bet${h.suspect ? " off" : ""}">
    <div class="meta"><span>${quand(h.debut)}</span><span>${bk(h.book)}${h.sport ? " · " + sport(h.sport) : ""}</span></div>
    <div class="match">${esc(h.match)}</div>
    <div class="pick">${esc(h.pari)}</div>
    ${h.pourquoi ? `<p class="why">${esc(h.pourquoi)}</p>` : ""}
    <dl class="grid">
      ${cell("Cote", fr(h.cote))}${cell("Cote juste", fr(h.juste))}${cell("Proba", pct(h.p,1,false))}${cell("EV", pct(h.ev), tone(h.ev))}
      ${cell("Mise", eur(h.mise,false))}${cell("Kelly", pct(h.kelly,1,false))}${cell("CLV", pct(h.clv), tone(h.clv))}${cell("Résultat", res)}
    </dl>
    ${h.suspect && !h.pourquoi ? `<div class="note flag">${esc(SUS[h.suspect] || h.suspect)}</div>` : ""}
    <details><summary>Détail du calcul</summary><div class="calc">${calcul(h)}</div></details>
  </article>`;
}

function paris(d){
  const H = d.historique || [], now = Date.now();
  const open = H.filter(h => h.etat === "en cours" && !h.suspect && new Date(h.debut) > now);
  const past = H.filter(h => !open.includes(h));
  let s = `<h2>${open.length ? `${open.length} pari${open.length>1?"s":""} à jouer` : "Rien à jouer pour l'instant"}</h2>`;
  s += open.length
    ? `<p class="lead">Vérifie que la cote est toujours au moins égale dans l'appli avant de miser.</p>` + open.map(bet).join("")
    : `<p class="lead">Une alerte part quand une cote dépasse la cote juste d'au moins 3 %.` +
      (d.proches && d.proches.length ? ` Les plus proches en ce moment :</p>` + proches(d.proches) : `</p>`);
  s += `<h2>Historique</h2><p class="lead">${past.length} pari${past.length>1?"s":""}, du plus récent au plus ancien.</p>` +
    (past.length ? past.map(bet).join("") : `<p class="mute">Aucun pari pour l'instant.</p>`);
  return s;
}
function proches(P){
  return `<table><tr><th>Pari</th><th>Cote</th><th>Juste</th><th>Écart</th></tr>` +
    P.slice(0,6).map(p => `<tr><td>${esc(p.match)}<small>${esc(p.pari)} · ${bk(p.book)}</small></td><td>${fr(p.cote)}</td>
      <td>${fr(p.juste)}</td><td class="${tone(p.ev)}">${pct(p.ev)}</td></tr>`).join("") + `</table>`;
}
function bilan(d){
  const b = d.bilan, H = (d.historique || []).filter(h => !h.suspect);
  const won = H.filter(h => h.etat === "gagné").length, lost = H.filter(h => h.etat === "perdu").length;
  const ic = b.clv_ic ? `${pct(b.clv_ic[0])} à ${pct(b.clv_ic[1])}` : "—";
  const reste = Math.max(0, 300 - b.regles);
  let s = `<h2>Les vrais paris</h2><dl class="sum">
    <div><dt>Paris proposés</dt><dd>${b.paris}${b.ecartes ? ` <span class="mute">(+ ${b.ecartes} écartés)</span>` : ""}</dd></div>
    <div><dt>Réglés</dt><dd>${b.regles} · ${won} gagné${won>1?"s":""}, ${lost} perdu${lost>1?"s":""}</dd></div>
    <div><dt>Gain</dt><dd class="${tone(b.gain)}">${eur(b.gain)} <span class="mute">sur ${eur(b.mises,false)}</span></dd></div>
    <div><dt>ROI</dt><dd class="${tone(b.roi)}">${pct(b.roi)}</dd></div>
    <div><dt>CLV moyenne (n = ${b.n_clv})</dt><dd class="${tone(b.clv)}">${pct(b.clv)}</dd></div>
    <div><dt>Intervalle de confiance 95 %</dt><dd>${ic}</dd></div></dl>
    <div class="verdict">${reste ? `Trop tôt pour conclure : il manque environ ${reste} paris réglés pour distinguer un vrai avantage de la chance.`
      : (b.clv_ic && b.clv_ic[0] > 0 ? "La CLV est positive avec confiance : l'avantage semble réel." : "Assez de paris, mais la CLV n'est pas positive avec confiance : pas d'avantage démontré.")}</div>`;
  if (d.fictif && d.fictif.length) {
    const nom = n => n.startsWith("Valeur") ? "Valeur 4 %" : n.startsWith("Témoin apparié") ? "Témoin apparié" : "Témoin au hasard";
    s += `<h2>Stratégies testées en fictif</h2><p class="lead">Bankroll fictive de 1 000 €, aucune alerte. Une stratégie ne compte que si elle bat son témoin apparié.</p>
    <table><tr><th>Stratégie</th><th>Paris</th><th>ROI</th><th>CLV</th><th>Bankroll</th></tr>` +
    d.fictif.map(f => `<tr><td>${esc(nom(f.nom))}<small>${f.regles} réglés</small></td><td>${f.paris}</td><td class="${tone(f.roi)}">${pct(f.roi)}</td>
      <td class="${tone(f.clv)}">${pct(f.clv)}</td><td>${fr(f.bankroll,0)} €</td></tr>`).join("") + `</table>`;
  }
  s += `<h2>Comment c'est calculé</h2><ol>
    <li><b>Probabilité juste</b> : le prix sur Polymarket, un marché où des parieurs s'échangent les paris. On prend le milieu entre le prix d'achat et le prix de vente ; sur un 1N2, les trois issues sont ramenées à 100 %.</li>
    <li><b>EV</b> (gain moyen attendu par euro misé) = probabilité × cote − 1. Alerte si EV ≥ 3 % et si l'EV reste positive avec le pire prix, cote entre 1,30 et 5,00, de 20 min à 30 h avant le match.</li>
    <li><b>Mise</b> = un quart de Kelly, au plus 2 % de la bankroll.</li>
    <li><b>CLV</b> = cote prise × probabilité juste au coup d'envoi − 1. Positive en moyenne : l'outil prend de meilleures cotes que le marché final. C'est le meilleur signal avant d'avoir des centaines de résultats.</li></ol>`;
  return s;
}
function marche(d){
  let s = `<h2>Les bookmakers face à la cote juste</h2><p class="lead">Dernier passage. Écart médian : combien le bookmaker paie de moins que la cote juste, en général.</p>
    <table><tr><th>Bookmaker</th><th>Cotes</th><th>Écart médian</th><th>Meilleur</th></tr>` +
    (d.books || []).map(b => `<tr><td>${bk(b.book)}</td><td>${b.cotes}</td><td class="${tone(b.ev_mediane)}">${pct(b.ev_mediane)}</td>
      <td class="${tone(b.meilleure)}">${pct(b.meilleure)}</td></tr>`).join("") + `</table>`;
  s += `<h2>Retard sur le marché (7 jours)</h2><p class="lead">Après un mouvement de Polymarket, combien de temps le bookmaker met à suivre.</p>` +
    ((d.retard || []).length ? `<table><tr><th>Bookmaker</th><th>Suivis</th><th>Délai médian</th><th>Sous 15 min</th></tr>` +
      d.retard.map(r => `<tr><td>${bk(r.book)}<small>${r.pas_suivis} non suivis</small></td><td>${r.suivis}</td>
        <td>${r.mediane_min == null ? "—" : fr(r.mediane_min,0) + " min"}</td><td>${r.en_15min == null ? "—" : pct(r.en_15min,0,false)}</td></tr>`).join("") + `</table>`
      : `<p class="mute">Pas encore de mouvement mesuré.</p>`);
  return s;
}
function sante(d){
  const s = d.sante || {};
  const src = Object.entries(s.sources || {});
  let h = `<h2>Dernier passage</h2><dl class="sum">
    <div><dt>Cotes comparées</dt><dd>${s.cotes ?? "—"}</dd></div>
    <div><dt>Matchs avec cote juste</dt><dd>${s.matchs_ref ?? "—"}</dd></div>` +
    src.map(([k,v]) => `<div><dt>${esc(k)}</dt><dd class="${v ? "" : "mute"}">${v ? v + " matchs" : "pas lu à ce passage"}</dd></div>`).join("") +
    (s.en_pause && s.en_pause.length ? `<div><dt>En pause (le site refuse)</dt><dd class="down">${s.en_pause.map(esc).join(", ")}</dd></div>` : "") +
    `<div><dt>Erreurs</dt><dd class="${s.erreurs && s.erreurs.length ? "down" : "up"}">${s.erreurs && s.erreurs.length ? s.erreurs.length : "aucune"}</dd></div></dl>` +
    (s.erreurs && s.erreurs.length ? `<p class="lead" style="margin-top:8px">${s.erreurs.map(esc).join("<br>")}</p>` : "");
  if (d.jours && d.jours.length) h += `<h2>Jour par jour</h2><p class="lead">Un passage toutes les 2 à 6 minutes environ. Rouge : arrêt de plus de 30 minutes.</p>
    <table><tr><th>Jour</th><th>Passages</th><th>Plus long arrêt</th><th>Alertes</th></tr>` +
    d.jours.slice().reverse().map(j => `<tr><td>${esc(j.jour.slice(8,10) + "/" + j.jour.slice(5,7))}</td><td>${j.passages}</td>
      <td class="${j.trou_max_min > 30 ? "down" : ""}">${!j.passages ? "toute la journée" : j.trou_max_min >= 90 ? fr(j.trou_max_min/60,1) + " h" : j.trou_max_min + " min"}</td>
      <td>${j.alertes}</td></tr>`).join("") + `</table>`;
  return h + `<p class="foot">Bookmakers agréés ANJ uniquement. L'outil détecte, il ne parie jamais tout seul.</p>`;
}

let data = null;
function render(){
  if (!data) return;
  const el = document.getElementById("maj"), age = (Date.now() - new Date(data.maj)) / 60000;
  el.textContent = "Mis à jour " + ago(data.maj); el.className = age > 60 ? "late" : "";
  for (const [id, f] of [["paris", paris], ["bilan", bilan], ["marche", marche], ["sante", sante]]) {
    const sec = document.getElementById("t-" + id), open = [...sec.querySelectorAll("details")].map(x => x.open);
    sec.innerHTML = f(data);
    sec.querySelectorAll("details").forEach((x, i) => { if (open[i]) x.open = true; });
  }
}
async function load(){
  try {
    const r = await fetch(SRC + "?t=" + Date.now(), {cache: "no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    data = await r.json(); render();
  } catch (e) { const el = document.getElementById("maj"); el.textContent = "Données indisponibles (" + e.message + ")"; el.className = "late"; }
}
function tab(t){
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id === "t-" + t));
  try { localStorage.setItem("tab", t); } catch (e) {}
  window.scrollTo(0, 0);
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => tab(b.dataset.t));
try { const t = localStorage.getItem("tab"); if (["paris","bilan","marche","sante"].includes(t)) tab(t); } catch (e) {}
load(); setInterval(load, 120000); setInterval(render, 60000);
</script>
</body>
</html>
